strategy.type=apollo-v5-liquidity-limit
strategy.atrPeriod=14
strategy.volumePeriod=20
strategy.minimumBaseBars=12
strategy.maximumBaseBars=48
strategy.minimumBaseRangeAtr=0.75
strategy.maximumBaseRangeAtr=2.50
strategy.maximumCenterDriftAtr=0.35
strategy.maximumSlopeAtrPerBar=0.025
strategy.maximumPenetrationFraction=0.35
strategy.boundaryPenetrationAtr=0.10
strategy.entranceDistanceAtr=0.25
strategy.breakoutSearchBars=96
strategy.reclaimWindowBars=24
strategy.breakoutAtr=0.15
strategy.minimumBreakoutVolumeRatio=1.20
strategy.minimumZoneShare=0.02
strategy.minimumPocShare=0.05
strategy.minimumBaseVolumeRatio=1.20
strategy.stopBaseHeightFraction=0.25
strategy.minimumRewardRisk=3
strategy.maximumHoldingBars=96
# Same map-search hypothesis as apollo-v5-btc.properties.
strategy.baseMapLookbackDays=42
# Disabled for the same reason recorded in apollo-v5-btc.properties (2026-08-10): mis-scoped to
# base-formation touches, and Family B doesn't wait for a swing reversal for this to matter the
# same way; kept at a non-rejecting value rather than removed.
strategy.maximumBoundaryTouches=999
# Same ATR-scaled analysis-bin hypothesis as apollo-v5-btc.properties.
strategy.pocBinAtrFraction=0.1
# Test A (roadmap step 2): when > 0, prefer the strongest volume concentration between price and
# the mapped zone as an earlier target (Книга 2.0 p.32). 0 disables and preserves the frozen
# baseline; the value is the minimum share of that band the peak must hold to be used.
strategy.internalWaveMinimumShare=0
# Roadmap step 6 (2026-08-11): reject a 15m entry that fights confirmed higher-timeframe structure.
# Direct source basis - slom_trenda.mp4 states "your 15-minute against the higher timeframe" and
# "[breaks] must alternate". Bias needs a higher high AND higher low (or lower/lower) on confirmed
# 1h pivots; mixed structure is undecided and never blocks. 0 disables and preserves the baseline.
strategy.requireHigherTimeframeAlignment=1
strategy.higherTimeframePivotStrength=3
# Task #11 (2026-08-11): a consumed base can no longer produce an ENTRY, but when this is 1 its
# price stays eligible as a TARGET. Source basis: marked levels persist far beyond first contact
# (2,440.87 appears on 2026-03-04 and again 2026-05-12). 0 preserves the prior behaviour.
strategy.consumedBasesRemainTargets=0
# Phase 1a (2026-08-11): absorption filter on zone aggressor delta, normalised by zone volume.
# LONG requires delta <= -X (zone built on sell aggression that was absorbed), SHORT requires
# delta >= +X. 0 disables and preserves the prior behaviour.
strategy.minimumAbsorptionDelta=0
market.symbol=BTCUSDT
market.interval=15m
# Acceptance quality (2026-08-11, source p.53 / p.3): acceptance beyond a broken base must be built
# from impulse candles, not wicks. A candle counts when its body is at least this fraction of its
# high-low range AND closes in the break direction. 0 disables and reproduces the frozen V5 baseline.
# Thresholds declared in APOLLO_V7_ACCEPTANCE_PREREGISTRATION.md before implementation, not tuned.
strategy.acceptanceMinimumBodyFraction=0
strategy.acceptanceMinimumBodyCandles=2
# V7 fix 2 (source pp.36,52-54 + 40-41): 0=geometric fraction of base height (frozen V5),
# 1=structural invalidation at the volume level, with the deep retest given the wider stop.
strategy.stopMode=0
# V7 fix 1 (source pp.25,33): 1=build the fixed profile only from candles fully inside the base
# body bounds, excluding entrance and exit candles. 0=frozen V5 (every bucket incl. breakout bar).
strategy.profileBodyBoundedSelection=0
# V7 (source pp.24,26): 0=reclaim close beyond the zone (frozen V5), 1=rest a limit slightly
# before the principal volume and let price come to it, which is what Family B actually specifies.
strategy.entryMode=0
strategy.limitOrderLifetimeBars=96
