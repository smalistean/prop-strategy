strategy.type=gerchik-bounce
strategy.atrPeriod=14
# Люфт: price x 0.04%. Gerchik's constant; also the БПУ touch tolerance, since the source defines
# "не добивает" in units of люфт.
strategy.entryOffsetFraction=0.0004
# "БПУ-1 и БПУ-2 должны идти друг за другом". 1 = strict adjacency (the literal text); 3 = the loose
# reading the Block 4 practice video shows. Primary run uses 3; 1 is reported alongside, not chosen
# by whichever performs better. See GERCHIK_V2_PREREGISTRATION.md.
strategy.maximumBpuGapBars=3
strategy.stopBufferAtr=0.10
strategy.minimumRewardRisk=3
strategy.requireMirror=1
strategy.minimumTouches=2
strategy.orderLifetimeBars=4
strategy.maximumHoldingBars=96
market.symbol=BTCUSDT
market.interval=15m
