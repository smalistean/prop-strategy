strategy.type=gerchik-breakout
strategy.atrPeriod=14
# "Подход к уровню на маленьких барах", "присутствует поджатие". The source describes the approach
# qualitatively with no numbers, so these three are OUR operationalisation, declared before running
# and not swept. They are the weakest part of this implementation.
strategy.compressionBars=4
strategy.compressionAtrFraction=0.70
strategy.approachDistanceAtr=0.50
# "На противоположной стороне (за уровнем) на 1-2 пункта выставляется buy stop" - the same люфт.
strategy.entryOffsetFraction=0.0004
strategy.stopBufferAtr=0.10
strategy.minimumRewardRisk=3
strategy.requireMirror=1
strategy.minimumTouches=2
strategy.orderLifetimeBars=4
strategy.maximumHoldingBars=96
market.symbol=BTCUSDT
market.interval=15m
