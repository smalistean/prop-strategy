strategy.type=apollo-v5-base-poc-continuation
strategy.atrPeriod=14
strategy.volumePeriod=20
strategy.minimumBaseBars=12
strategy.maximumBaseBars=48
strategy.minimumBaseRangeAtr=0.75
strategy.maximumBaseRangeAtr=2.50
strategy.maximumCenterDriftAtr=0.35
strategy.maximumSlopeAtrPerBar=0.025
strategy.maximumPenetrationFraction=0.35
strategy.boundaryPenetrationAtr=0.10
strategy.entranceDistanceAtr=0.25
strategy.breakoutSearchBars=96
strategy.reclaimWindowBars=24
strategy.swingPivotStrength=2
strategy.minimumSwingSizeAtr=0.25
strategy.breakoutAtr=0.15
strategy.minimumBreakoutVolumeRatio=1.20
strategy.minimumZoneShare=0.02
strategy.minimumPocShare=0.05
strategy.minimumBaseVolumeRatio=1.20
strategy.pocTouchAtr=0.15
strategy.stopBaseHeightFraction=0.25
strategy.minimumRewardRisk=3
strategy.maximumHoldingBars=96
# Map search hypothesis (2026-08-10): the map may still find a base within the original 12-48
# candle window, but now also searches back this many days for a wider horizontal cluster; width
# and drift ATR bounds scale by sqrt(bars/maximumBaseBars) beyond that window instead of staying
# fixed at the short-scale multiple. A first, deliberately moderate step toward the source's
# multi-day/multi-week bases, not a claim that seven days fully reproduces them.
strategy.baseMapLookbackDays=7
# Disabled (2026-08-10): counts touches to a boundary DURING BASE FORMATION, before any breakout.
# Verified against the one real, exact-price labelled example available (APOLLO_LABELLED_EXAMPLES.md,
# ETHUSDT 2026-08-03 sweep to 1,827.18): the base's own low was touched 3 times before its breakout,
# and the 3rd touch was the documented course entry trigger itself, not noise to discard. Книга 2.0
# p.98 warns against a naive bounce-entry at a repeated level; that risk is already handled here by
# "first revisit permanently consumes the base," which applies post-breakout, not during formation.
# Left at a value that cannot reject anything rather than removing the field, so the touch counts
# stay available as data for a correctly-scoped (entry-time, not formation-time) version later.
strategy.maximumBoundaryTouches=999
# Volume-profile analysis bin width (2026-08-10): the raw stored bin width (VolumeProfilePriceSteps)
# is deliberately finer than any single POC/zone computation needs. This rounds it up to a whole
# multiple sized as this fraction of ATR at the breakout bar, so resolution scales with current
# volatility (and therefore price, since ATR moves with price) instead of one fixed dollar width
# picked once at import time. 0.1 is a first hypothesis: roughly 10 distinguishable price levels
# per typical ATR swing.
strategy.pocBinAtrFraction=0.1
# Test A (roadmap step 2): when > 0, prefer the strongest volume concentration between price and
# the mapped zone as an earlier target (Книга 2.0 p.32). 0 disables and preserves the frozen
# baseline; the value is the minimum share of that band the peak must hold to be used.
strategy.internalWaveMinimumShare=0
market.symbol=BTCUSDT
market.interval=15m
