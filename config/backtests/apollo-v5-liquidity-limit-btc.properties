strategy.type=apollo-v5-liquidity-limit
strategy.atrPeriod=14
strategy.volumePeriod=20
strategy.minimumBaseBars=12
strategy.maximumBaseBars=48
strategy.minimumBaseRangeAtr=0.75
strategy.maximumBaseRangeAtr=2.50
strategy.maximumCenterDriftAtr=0.35
strategy.maximumSlopeAtrPerBar=0.025
strategy.maximumPenetrationFraction=0.35
strategy.boundaryPenetrationAtr=0.10
strategy.entranceDistanceAtr=0.25
strategy.breakoutSearchBars=96
strategy.reclaimWindowBars=24
strategy.breakoutAtr=0.15
strategy.minimumBreakoutVolumeRatio=1.20
strategy.minimumZoneShare=0.02
strategy.minimumPocShare=0.05
strategy.minimumBaseVolumeRatio=1.20
strategy.stopBaseHeightFraction=0.25
strategy.minimumRewardRisk=3
strategy.maximumHoldingBars=96
# Same map-search hypothesis as apollo-v5-btc.properties.
strategy.baseMapLookbackDays=7
# Disabled for the same reason recorded in apollo-v5-btc.properties (2026-08-10): mis-scoped to
# base-formation touches, and Family B doesn't wait for a swing reversal for this to matter the
# same way; kept at a non-rejecting value rather than removed.
strategy.maximumBoundaryTouches=999
# Same ATR-scaled analysis-bin hypothesis as apollo-v5-btc.properties.
strategy.pocBinAtrFraction=0.1
# Test A (roadmap step 2): when > 0, prefer the strongest volume concentration between price and
# the mapped zone as an earlier target (Книга 2.0 p.32). 0 disables and preserves the frozen
# baseline; the value is the minimum share of that band the peak must hold to be used.
strategy.internalWaveMinimumShare=0
market.symbol=BTCUSDT
market.interval=15m
