# Acceptance profile for strategies expected to complete fewer than one trade per day.
# Sixty trades over the two-year training window is the minimum evidence floor.
acceptance.minimumNetProfit=0.01
acceptance.minimumProfitFactor=1.10
acceptance.maximumDrawdownPercent=10
acceptance.minimumTrades=60
acceptance.minimumProfitableSubperiods=3
acceptance.maximumSinglePositiveSubperiodContributionPercent=60
acceptance.minimumAverageWinLossRatio=1.20

# Re-run with both fees and slippage multiplied by this value.
acceptance.stressCostMultiplier=1.50
acceptance.minimumStressedNetProfit=0.01
