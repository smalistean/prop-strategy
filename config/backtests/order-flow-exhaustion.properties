strategy.type=order-flow-exhaustion

# Frozen before the first performance run. Evaluated on completed 5m bars.
strategy.trendEmaPeriod=200
strategy.atrPeriod=14
strategy.minimumCoverage=0.99
strategy.minimumQuality=0.75
strategy.maximumTrendDiscount=0.02

# A sell shock with large seller participation must resist further price decline.
strategy.maximum15mImbalance=-0.08
strategy.maximumLargeTradeImbalance=-0.10
strategy.minimumAbsorption=0.04
strategy.minimumExhaustion=0.02

# Recent flow must recover relative to the preceding hour.
strategy.minimumDeltaAcceleration=0.03
strategy.minimumDivergence=0.05
strategy.minimum15mReturn=-0.005
strategy.maximum15mReturn=0.001

# Exit after the rebound, renewed failure, or one hour.
strategy.recoveredBuyImbalance=0.10
strategy.renewedSellImbalance=-0.15
strategy.stopAtrMultiplier=1.25
strategy.rewardRiskRatio=2.0
strategy.maximumHoldingBars=12
strategy.cooldownBars=6
