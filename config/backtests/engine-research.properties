market.symbol=BTCUSDT
market.interval=15m

# Calendar shifted three months EARLIER on 2026-08-11 so that every 2026 course video sits after
# the reserved final-test window and can be used for labelling without burning held-out data.
# Previously training [2023-05-07, 2025-05-07) / validation [2025-05-07, 2025-11-07) / final
# [2025-11-07, 2026-05-07), which placed the February-May 2026 review videos inside the final test.
# Everything from 2026-02-07 onward is now post-final-test. Results produced before this change are
# NOT directly comparable to results after it.
backtest.dataset=TRAINING
data.trainingStart=2023-02-07
data.trainingEnd=2025-02-07
data.validationStart=2025-02-07
data.validationEnd=2025-08-07
data.finalTestStart=2025-08-07
data.finalTestEnd=2026-02-07

account.initialBalance=100000

risk.fractionPerTrade=0.005
risk.maxLeverage=3

# Maker entries and normal exits use strict 1m trade-through; protective stops are taker.
execution.makerEnabled=true
execution.makerFeeBps=1.8
execution.takerFeeBps=4.5
execution.takerSlippageBps=2
execution.makerOffsetBps=1
execution.makerOrderLifetimeMinutes=5
execution.strategyExitTakerFallback=true
# Optional: after this favorable R multiple, cover actual entry fee and expected taker exit costs.
# Disabled because 0.75R, 1.0R, and 1.5R all reduced BTC RSI/ATR training profit.
execution.breakEvenEnabled=false
execution.breakEvenTriggerRiskMultiple=1.0

# Experiment-5 exit overlay. Defaults preserve the frozen baseline.
exit.partialEnabled=false
exit.partialTriggerR=1.0
exit.partialFraction=0.5
exit.trailingEnabled=false
exit.trailingTriggerR=1.0
exit.trailingDistanceR=1.0
exit.lackOfProgressEnabled=false
exit.lackOfProgressBars=8
exit.minimumProgressR=0.25

# RESEARCH CONFIG - prop terminations disabled so a run covers its whole window.
#
# With the real 10% total-drawdown rule, every one of the 15 Gerchik G1 runs terminated in the first
# month of a two-year window (BTCUSDT stopped 2023-03-06), so the "two-year" result was a one-month
# sample. Max drawdown is still measured and reported in every performance report; it is simply no
# longer allowed to end the run. Daily loss is disabled for the same reason.
#
# Results produced with this file are NOT comparable to results produced with engine.properties,
# where the prop rules are live. Use it for measuring a strategy's behaviour over a full period, not
# for judging whether an account would have survived - by construction it cannot answer that.
prop.maxDailyLossPercent=1000000
prop.maxTotalDrawdownPercent=1000000
# Effectively disabled (2026-08-10): a real prop account would stop trading at +10% and need a new
# evaluation, but for research the profit-target termination was truncating good runs mid-period
# (e.g. XRPUSDT Family B hit PROFIT_TARGET_REACHED and never traded its last ~3 training months),
# hiding exactly the tail behavior stability/concentration checks need to see. Loss/drawdown limits
# stay real risk-of-ruin bounds and are unchanged; only the profit-side cutoff is disabled here.
prop.profitTargetPercent=1000000
prop.timezone=UTC
