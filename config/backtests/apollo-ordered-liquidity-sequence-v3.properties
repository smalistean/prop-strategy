# Assumption set A from `Книга 2.0.pdf`; every discretionary proxy is explicit below.
strategy.type=apollo-ordered-liquidity-sequence-v3
strategy.atrPeriod=14
strategy.volumePeriod=20
# Book: a base has 4+ points. Proxy: 4 clustered 4h pivot touches in the prior 12 days.
strategy.mapLookbackBars=72
strategy.mapPivotStrength=2
strategy.mapMinimumTouches=4
strategy.mapToleranceAtr=0.50
# Book: do not fade an already-used liquidity. Proxy: no level visit in the prior 12 hours.
strategy.freshnessBars=48
# Book: sweep then several full-bodied acceptance candles. Proxy: two bars within six 15m bars.
strategy.reclaimWindowBars=6
strategy.minimumAcceptanceBars=2
strategy.localBreakBars=3
strategy.sweepAtr=0.10
strategy.levelBufferAtr=0.10
# A full body is at least 0.20 ATR; a separate volume filter is neutral in this first set.
strategy.minimumBodyAtr=0.20
strategy.minimumConfirmationVolumeRatio=1.00
strategy.stopBufferAtr=0.25
strategy.minimumRewardRisk=3.0
strategy.maximumHoldingBars=96
market.symbol=BTCUSDT
market.interval=15m

backtest.dataset=TRAINING
data.trainingStart=2023-08-07
data.trainingEnd=2025-08-07
data.validationStart=2025-08-07
data.validationEnd=2026-02-07
data.finalTestStart=2026-02-07
data.finalTestEnd=2026-08-07

account.initialBalance=100000
risk.fractionPerTrade=0.005
risk.maxLeverage=3
execution.makerEnabled=true
execution.makerFeeBps=1.8
execution.takerFeeBps=4.5
execution.takerSlippageBps=2
execution.makerOffsetBps=1
execution.makerOrderLifetimeMinutes=5
execution.strategyExitTakerFallback=true
execution.breakEvenEnabled=false
execution.breakEvenTriggerRiskMultiple=1.0
exit.partialEnabled=false
exit.partialTriggerR=1.0
exit.partialFraction=0.5
exit.trailingEnabled=false
exit.trailingTriggerR=1.0
exit.trailingDistanceR=1.0
exit.lackOfProgressEnabled=false
exit.lackOfProgressBars=8
exit.minimumProgressR=0.25
prop.maxDailyLossPercent=5
prop.maxTotalDrawdownPercent=10
prop.profitTargetPercent=10
prop.timezone=UTC
