strategy.type=gerchik-false-breakout
strategy.atrPeriod=14
# "предпочтительно, чтобы глубина пробоя умещалась в 1/3 ATR" - excursion beyond the level.
strategy.maximumBreakDepthAtr=0.3333
# Люфт: price x 0.04%. Gerchik's constant, confirmed by the 09.11 example (21375 -> 21365).
strategy.entryOffsetFraction=0.0004
# Protective stop behind the false-breakout wick ("ТС ставят за хвостом бара ЛП") plus this buffer.
# The 0.2% calculated stop is deliberately NOT used: measured at 0.28-0.53x crypto 15m ATR it sits
# inside a single bar's range. See GERCHIK_V2_PREREGISTRATION.md.
strategy.stopBufferAtr=0.10
# Target is the nearest opposing level; reject below this ratio. Gerchik's 3:1.
strategy.minimumRewardRisk=3
# Зеркальный уровень is 5 of 8 levels in the labelled examples, so it ranks first.
strategy.requireMirror=1
# БСУ plus БПУ-1.
strategy.minimumTouches=2
strategy.orderLifetimeBars=4
strategy.maximumHoldingBars=96
market.symbol=BTCUSDT
market.interval=15m
